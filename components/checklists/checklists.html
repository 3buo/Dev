<div id="view-checklists">
    <div class="container">
        <h2>Nuevo Checklist</h2>
        <div class="input-group">
            <input type="text" id="clTitle" placeholder="Nombre de la nueva lista (Ej: Mercado, Proyecto X)">
            <button onclick="createChecklist()">Crear Lista</button>
        </div>
    </div>
    
    <div id="checklistsContainer"></div>

    <div id="editClModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; align-items: center; justify-content: center; background: var(--overlay-strong); backdrop-filter: blur(5px);">
        <div class="container" style="max-width: 450px; width: 90%; background: var(--bg-surface); border: 1px solid var(--secondary); max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column;">
            <h2 style="color: var(--primary); margin-top: 0;">Editar Checklist</h2>
            
            <input type="hidden" id="editClIndex">
            
            <label style="font-size: var(--text-xs); color: var(--text-secondary); margin-bottom: var(--space-1);">Título de la lista:</label>
            <input type="text" id="editClTitle" placeholder="Título" style="width: 100%; margin-bottom: var(--space-5); box-sizing: border-box; font-size: 1.1em; font-weight: bold; color: var(--secondary);">
            
            <h3 style="font-size: 1em; color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); padding-bottom: 5px;">Elementos:</h3>
            
            <div id="editClItems" style="margin-bottom: var(--space-4); display: flex; flex-direction: column; gap: 8px;"></div>
            
            <label style="font-size: var(--text-xs); color: var(--primary); margin-bottom: var(--space-1);">Añadir Nuevo Elemento:</label>
            <div class="input-group" style="margin-bottom: var(--space-6);">
                <input type="text" id="editClNewItem" placeholder="Escribe y presiona Añadir..." onkeypress="if(event.key === 'Enter') addEditClItem()">
                <button onclick="addEditClItem()" style="background: var(--tint-teal); color: var(--secondary); border: 1px solid var(--secondary);">+ Añadir</button>
            </div>

            <button onclick="saveEditChecklist()" style="width: 100%; margin-bottom: var(--space-3); font-size: 1.1em;">Guardar Cambios</button>
            <button onclick="closeEditClModal()" style="width: 100%; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-strong);">Cancelar</button>
        </div>
    </div>
</div>
