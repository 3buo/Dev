<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify</title>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="var(--bg-canvas)">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="components/alarm/alarm.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer integrity="sha256-ymhDBwPE9ZYOkHNYZ8bpTSm1o943EH2BAOWjAQB+nm4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer integrity="sha256-1G2Xof0CLF+yn6L0Xry8MiAtc67r8HbOX3JI9UmPx9c=" crossorigin="anonymous"></script>
</head>
<body>
    
    <div id="cmdOverlay" onclick="closeCmd(event)">
        <div class="cmd-box">
            <input type="text" id="cmdInput" class="cmd-input" placeholder="Escribe un comando..." autocomplete="off">
            <ul id="cmdResults" class="cmd-results"></ul>
        </div>
    </div>
    
    <div id="authScreen">
        <div class="auth-container">
            <h1 style="color: var(--accent-primary); margin-top: 0;">Taskify <span style="font-size: var(--text-sm); color: var(--text-tertiary); font-weight: var(--font-medium);">Productividad</span></h1>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-6);">Accede a tu instancia segura</p>
            <label class="sr-only" for="authEmail">Correo electrónico</label>
            <input type="email" id="authEmail" class="auth-input" placeholder="Correo electrónico" required>
            <label class="sr-only" for="authPassword">Contraseña</label>
            <input type="password" id="authPassword" class="auth-input" placeholder="Contraseña" required>
            <button class="auth-btn" onclick="appLogin()">Iniciar Sesión</button>
            <button class="auth-btn auth-btn-sec" onclick="appRegister()">Crear Cuenta Nueva</button>
            <div class="auth-links" onclick="appResetPassword()">¿Olvidaste tu contraseña?</div>
        </div>
    </div>
    
    <div id="mainApp" style="display: none;">
        
        <div id="mdToolbar">
            <button class="md-btn" onmousedown="applyMd(event, '**', '**')" title="Negrita">B</button>
            <button class="md-btn" onmousedown="applyMd(event, '*', '*')" title="Cursiva">I</button>
            <button class="md-btn" onmousedown="applyMd(event, '- ', '')" title="Lista">Lista</button>
            <button class="md-btn" onmousedown="applyMd(event, '[[', ']]')" title="Enlace Zettelkasten">[[ ]]</button> 
            <button class="md-btn" onmousedown="applyMd(event, '### ', '')" title="Título">H3</button>
            <button class="md-btn" onmousedown="applyMdTable(event)" style="color: var(--accent-secondary);">📊 Tabla</button>
        </div>
        
        <nav class="app-nav" aria-label="Navegación principal">
            <div class="tabs nav-items" id="tabContainer" role="tablist" aria-label="Módulos de Taskify">
                <button class="tab-btn" id="tab-dashboard" role="tab" aria-selected="false" aria-controls="tab-content-container" onclick="switchTab('dashboard')"><span class="tab-ico">🏠</span><span class="tab-label">Inicio</span></button>
                <button class="tab-btn active" id="tab-actividades" role="tab" aria-selected="true" aria-controls="tab-content-container" onclick="switchTab('actividades')"><span class="tab-ico">📝</span><span class="tab-label">Tareas</span></button>
                <button class="tab-btn" id="tab-finanzas" role="tab" aria-selected="false" aria-controls="tab-content-container" onclick="switchTab('finanzas')"><span class="tab-ico">🔒</span><span class="tab-label">Finanzas</span></button>
                <button class="tab-btn" id="tab-notas" role="tab" aria-selected="false" aria-controls="tab-content-container" onclick="switchTab('notas')"><span class="tab-ico">📓</span><span class="tab-label">Notas</span></button>
            </div>
            <div class="nav-more-wrap">
                <button class="tab-btn nav-more-btn" id="btnNavMore" aria-haspopup="true" aria-expanded="false" aria-controls="navMoreMenu" onclick="toggleNavMore(event)">
                    <span class="tab-ico">⋯</span><span class="tab-label">Más</span>
                </button>
                <div class="nav-more-menu" id="navMoreMenu" role="menu" hidden>
                    <button class="more-item" id="tab-checklists" role="menuitem" onclick="switchTab('checklists')">☑️ Checklists</button>
                    <button class="more-item" id="tab-recordatorios" role="menuitem" onclick="switchTab('recordatorios')">🔔 Recordatorios</button>
                    <button class="more-item" id="btnThemeToggle" role="menuitem" onclick="toggleTheme()">🌙 Tema: Oscuro</button>
                    <button class="more-item more-danger" role="menuitem" onclick="appLogout()">🚪 Cerrar sesión</button>
                </div>
            </div>
        </nav>
        
        <div id="tab-content-container"></div>
        
        
        
        
        </div>
        
        <button class="alarm-floating-btn" onclick="window.toggleAlarmConfig()" aria-label="Configurar sonido de alertas" title="Configurar sonido de alertas">🔊</button>
        
        <div id="alarmConfigPanel" class="alarm-config-panel">
            <h3>⚙️ Sonido de Alertas</h3>
            
            <div style="display: flex; flex-direction: column; gap: var(--space-1);">
                <label>Tono de Aviso</label>
                <select id="alarmSoundSelect" class="alarm-select" onchange="window.previewAndSaveAlarmSettings()">
                    <option value="digital">Reloj Digital</option>
                    <option value="bell">Campanilla Suave</option>
                    <option value="scifi">Notificación Sci-Fi</option>
                </select>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: var(--space-1);">
                <label>Volumen</label>
                <input type="range" id="alarmVolumeSlider" class="alarm-slider" min="0" max="1" step="0.1" value="0.5" onchange="window.previewAndSaveAlarmSettings()">
            </div>
            
            <button onclick="window.toggleAlarmConfig()" style="background: transparent; border: 1px solid var(--border-subtle); color: var(--text-primary); padding: var(--space-2); border-radius: var(--radius-sm); cursor: pointer; margin-top: var(--space-1);">Cerrar</button>
        </div>
        
        <div id="sysAlarmModal" class="alarm-overlay" style="display: none;">
            <div class="alarm-content">
                <h1 style="color: var(--accent-primary); margin-top: 0;">⏰ ¡Es Hora!</h1>
                <h2 id="sysAlarmTitle" style="color: var(--text-primary); font-size: 1.5em; margin: 15px 0;">Recordatorio</h2>
                <div id="sysAlarmDesc" style="font-size: 1em; color: var(--text-secondary); margin-bottom: var(--space-6);"></div>
                
                <div class="alarm-buttons">
                    <button class="alarm-btn alarm-btn-outline" onclick="window.snoozeSystemAlarm()">Posponer 5 min</button>
                    <button class="alarm-btn alarm-btn-solid" onclick="window.completeSystemAlarm()">¡Entendido!</button>
                </div>
            </div>
        </div>
        
        
        
        
        
        
        <script type="module" src="js/app.js"></script>
        
        <script type="module" src="js/backup-ui.js"></script>
        
        <script type="module">
            import { devModeBridge } from './components/devmode/devmode.js';
            import { initBackupUI } from './js/backup-ui.js';
            devModeBridge.init();
            // Backup UI se inicializa, pero se muestra solo cuando devmode está autenticado
            initBackupUI();
            // Re-intento: cuando autenticas devmode, initBackupUI puede estar deshabilitado
            // por el gating; por eso lo volvemos a llamar en el siguiente tick.
            const devAuthPoll = setInterval(() => {
                if (window.__devModeIsAuthenticated) {
                    clearInterval(devAuthPoll);
                    try { initBackupUI(); } catch (e) {}
                }
            }, 300);
        </script>
        
        <script type="module">
            import { initAlarmSystem } from './components/alarm/alarm.js';
            // Aseguramos que se inicie cuando el estado de la app cambie/cargue
            window.addEventListener('stateChanged', () => {
                initAlarmSystem();
            });
        </script>
        
        <script type="module">
            import { prepare, layout } from 'https://esm.sh/@chenglou/pretext@1.0.0';
            
            console.log("🚀 Pretext activado: Optimizando cajas de texto en segundo plano.");
            
            const autoResizeTextarea = (textarea) => {
                if (textarea.clientWidth === 0) return;
                const text = textarea.value || textarea.placeholder || " ";
                const style = window.getComputedStyle(textarea);
                
                const font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
                const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
                const paddingY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
                const availableWidth = textarea.clientWidth - paddingX;
                
                let lineHeight = parseFloat(style.lineHeight);
                if (isNaN(lineHeight)) lineHeight = parseFloat(style.fontSize) * 1.5;
                
                try {
                    const prepared = prepare(text, font);
                    const result = layout(prepared, availableWidth, lineHeight);
                    const finalHeight = Math.max(result.height + paddingY, 80); 
                    textarea.style.height = `${finalHeight}px`;
                    textarea.style.overflowY = 'hidden'; 
                } catch (error) {
                    textarea.style.height = 'auto';
                    textarea.style.height = (textarea.scrollHeight) + 'px';
                }
            };
            
            document.addEventListener('input', (e) => {
                if (e.target.tagName.toLowerCase() === 'textarea') {
                    autoResizeTextarea(e.target);
                }
            });
            
            window.addEventListener('stateChanged', () => {
                setTimeout(() => {
                    document.querySelectorAll('textarea').forEach(autoResizeTextarea);
                }, 100);
            });
        </script>
        
        
    </body>
    </html>
